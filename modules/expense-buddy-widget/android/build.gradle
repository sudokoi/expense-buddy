plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.expensebuddywidget'
version = '1.0.0'

android {
  namespace "expo.modules.expensebuddywidget"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"

  // Direct read of the JS-owned MMKV store ("expense-buddy"): index + item JSON.
  // Same coordinates as react-native-mmkv so Gradle dedupes the classes.
  implementation "io.github.zhongwuzw:mmkv:2.4.1"

  // Periodic refresh backstop (30 min) when the app is never opened.
  implementation "androidx.work:work-runtime-ktx:2.9.0"

  // Tests
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.11.1"
  testImplementation "com.google.truth:truth:1.1.3"
}
