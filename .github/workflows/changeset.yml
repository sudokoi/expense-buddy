name: Changeset

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changeset:
    name: 📦 Version Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🏗️ Checkout
        uses: actions/checkout@v7
        with:
          # Use PAT to allow commits to trigger workflows
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: 📦 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: 📂 Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: 💾 Cache yarn downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-cache-

      - name: 💾 Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📥 Install dependencies
        run: yarn install --immutable

      - name: 🔄 Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GH_PAT }}

      - name: 🏷️ Push tag on release
        id: check-release
        run: |
          CHANGESET_COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "Changeset count: $CHANGESET_COUNT"

          if [ "$CHANGESET_COUNT" -eq "0" ] && [ "${{ steps.changesets.outputs.has-changesets }}" != "true" ]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists, skipping"
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "No tag for $TAG, should release"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            fi
          else
            echo "Changesets pending or PR created, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Push tag
        if: steps.check-release.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.check-release.outputs.tag }}"

          echo "Creating and pushing tag: $TAG"

          USER_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/user)
          USER_NAME=$(echo "$USER_DATA" | jq -r '.name // .login')
          USER_ID=$(echo "$USER_DATA" | jq -r '.id')
          USER_LOGIN=$(echo "$USER_DATA" | jq -r '.login')

          git config user.name "$USER_NAME"
          git config user.email "$USER_ID+$USER_LOGIN@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
