name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ✅ Lint, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🏗️ Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 🐘 Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-budget-v1-${{ hashFiles('.node-version', 'yarn.lock', 'app.config.js', 'eas.json', 'plugins/**', 'modules/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-budget-v1-

      - name: 📂 Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache yarn downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-cache-

      - name: 💾 Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📥 Install dependencies
        run: yarn install --immutable

      - name: 🎨 Check formatting
        run: yarn format:check

      - name: Check types and Expo compatibility
        run: |
          yarn typecheck
          yarn exec expo-doctor
          yarn exec expo install --check

      - name: 🔍 Lint
        run: yarn lint

      - name: 🧪 Test
        run: yarn test

      - name: 🎨 Check theme sync (palette ↔ global.css ↔ tailwind ↔ app.config)
        run: yarn check:theme

      - name: 🌗 Check theme flow (raw preference forwarded, no JS system resolution)
        run: yarn check:theme-flow

      - name: 🌐 Check Translations
        run: yarn check:translations
